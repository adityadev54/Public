server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Custom 404
    error_page 404 /404.html;
}

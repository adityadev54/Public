app = "touchline-aditya-vision"
# Set the app name after creating your Fly app.
primary_region = "iad"
[build]
  dockerfile = "Dockerfile"
[env]
  ASPNETCORE_ENVIRONMENT = "Production"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
